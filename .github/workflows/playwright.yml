name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly. Flake detection is a function of run count, and a push-only trigger
  # produces nothing on a week when nobody touches the repo.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  # The test job publishes the Allure report to gh-pages. Two overlapping runs -
  # a push landing near the nightly cron, or a manual dispatch on top of a push -
  # both clone gh-pages, both commit, and the loser's push is rejected with
  # "fetch first". That reports a fully green suite as a failed run, which is
  # exactly the kind of misleading red this repo is supposed to avoid.
  #
  # Queue rather than cancel: every scheduled run is a data point the flake
  # detection is counting on, so discarding one to save a few minutes is the
  # wrong trade.
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Bring up a containerised OrangeHRM and test against that, not against
      # the public demo.
      #
      # The demo was the reason this suite was red. It accepted writes with
      # HTTP 200 and silently discarded them, its employee autocomplete returned
      # unrendered "${firstName} ${lastName}" template strings, and one of its
      # endpoints took 10.9 seconds to answer. None of that is fixable from a
      # test, and all of it looked like a bug in this repository.
      #
      # A container also makes the run deterministic and roughly eight times
      # faster: the full suite is about a minute here against eight against the
      # demo, because it is not queueing behind everyone else on the internet.
      - name: Start and provision OrangeHRM
        run: ./docker/up.sh http://localhost:8090

      - name: Run tests
        run: npx playwright test
        env:
          ORANGEHRM_BASE_URL: http://localhost:8090
          # Not a secret: this instance is created empty and destroyed with the
          # runner. It is a strong password only because OrangeHRM 5.9 rejects
          # weak ones and redirects to a password-change screen instead of the
          # dashboard, which looks exactly like a failed login.
          ORANGEHRM_PASSWORD: Ohrm@1423
          # The only employee a fresh install has is the admin.
          ORANGEHRM_HIRING_MANAGER: OrangeHRM

      - name: Upload machine-readable results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-json
          path: |
            playwright-report.json
            junit-results.xml
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Feed this run into TestPulse, which is what puts this suite on the
      # public dashboard at testpulse-eight.vercel.app.
      #
      # always(), because a failing run is the data point that matters most -
      # skipping ingest on red would mean the flake history only ever sees green.
      #
      # Not on pull requests: branches that may never merge would pollute the
      # history, and the flake numbers would end up describing code nobody runs.
      - name: Record the run in TestPulse
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: Mohanad49/testpulse@main
        with:
          # The JSON report, not the JUnit one. Playwright JSON is the only
          # format of the four that reports retries, and retries are what the
          # same-commit flake strategy reads.
          path: playwright-report.json
          format: playwright
          suite: orangehrm-e2e
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          dashboard-url: https://testpulse-eight.vercel.app
          comment: "false"

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Fix permissions
        if: always()
        run: sudo chown -R $USER:$USER allure-history

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  # Repeat runs of one unchanged commit, on a schedule only.
  #
  # This is the input the "same-commit disagreement" flake strategy needs: if the
  # code did not change and the outcome did, that is close to proof rather than
  # inference. Three runs of the same SHA give it something to compare.
  #
  # Deliberately a separate job from `test` rather than a matrix on it. `test`
  # publishes the Allure report to gh-pages, and three copies of that job racing
  # to push to the same branch would fail or clobber each other.
  repeat:
    name: Repeat run ${{ matrix.attempt }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Bring up a containerised OrangeHRM and test against that, not against
      # the public demo.
      #
      # The demo was the reason this suite was red. It accepted writes with
      # HTTP 200 and silently discarded them, its employee autocomplete returned
      # unrendered "${firstName} ${lastName}" template strings, and one of its
      # endpoints took 10.9 seconds to answer. None of that is fixable from a
      # test, and all of it looked like a bug in this repository.
      #
      # A container also makes the run deterministic and roughly eight times
      # faster: the full suite is about a minute here against eight against the
      # demo, because it is not queueing behind everyone else on the internet.
      - name: Start and provision OrangeHRM
        run: ./docker/up.sh http://localhost:8090

      # continue-on-error because a failing run is data, not a broken pipeline.
      # The whole point is to record what happened, and a red X on a scheduled
      # job trains people to ignore scheduled jobs.
      - name: Run tests
        continue-on-error: true
        run: npx playwright test
        env:
          ORANGEHRM_BASE_URL: http://localhost:8090
          # Not a secret: this instance is created empty and destroyed with the
          # runner. It is a strong password only because OrangeHRM 5.9 rejects
          # weak ones and redirects to a password-change screen instead of the
          # dashboard, which looks exactly like a failed login.
          ORANGEHRM_PASSWORD: Ohrm@1423
          # The only employee a fresh install has is the admin.
          ORANGEHRM_HIRING_MANAGER: OrangeHRM

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-attempt-${{ matrix.attempt }}
          path: |
            playwright-report.json
            junit-results.xml
            allure-results/
          retention-days: 30

      # Each attempt is stored as its own run. TestPulse's natural key includes
      # the start time, so three runs of one unchanged commit do not collapse
      # into one - which is the entire reason this job exists.
      - name: Record the run in TestPulse
        if: always()
        continue-on-error: true
        uses: Mohanad49/testpulse@main
        with:
          path: playwright-report.json
          format: playwright
          suite: orangehrm-e2e
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          dashboard-url: https://testpulse-eight.vercel.app
          comment: "false"
