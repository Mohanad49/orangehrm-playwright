name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly. Flake detection is a function of run count, and a push-only trigger
  # produces nothing on a week when nobody touches the repo.
  schedule:
    - cron: "0 2 * * *"

concurrency:
  # The report job publishes the Allure report to gh-pages. Two overlapping runs -
  # a push landing near the nightly cron, or a manual dispatch on top of a push -
  # both clone gh-pages, both commit, and the loser's push is rejected with
  # "fetch first". That reports a fully green suite as a failed run, which is
  # exactly the kind of misleading red this repo is supposed to avoid.
  #
  # Queue rather than cancel: every scheduled run is a data point the flake
  # detection is counting on, so discarding one to save a few minutes is the
  # wrong trade.
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Bring up a containerised OrangeHRM and test against that, not against
      # the public demo.
      #
      # The demo was the reason this suite was red. It accepted writes with
      # HTTP 200 and silently discarded them, its employee autocomplete returned
      # unrendered "${firstName} ${lastName}" template strings, and one of its
      # endpoints took 10.9 seconds to answer. None of that is fixable from a
      # test, and all of it looked like a bug in this repository.
      #
      # A container also makes the run deterministic and roughly eight times
      # faster: the full suite is about a minute here against eight against the
      # demo, because it is not queueing behind everyone else on the internet.
      - name: Start and provision OrangeHRM
        run: ./docker/up.sh http://localhost:8090

      - name: Run tests
        run: npx playwright test
        env:
          ORANGEHRM_BASE_URL: http://localhost:8090
          # Not a secret: this instance is created empty and destroyed with the
          # runner. It is a strong password only because OrangeHRM 5.9 rejects
          # weak ones and redirects to a password-change screen instead of the
          # dashboard, which looks exactly like a failed login.
          ORANGEHRM_PASSWORD: Ohrm@1423
          # The only employee a fresh install has is the admin.
          ORANGEHRM_HIRING_MANAGER: OrangeHRM

      - name: Upload machine-readable results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-json
          path: |
            playwright-report.json
            junit-results.xml
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # The input for the `report` job below.
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # Feed this run into TestPulse, which is what puts this suite on the
      # public dashboard at testpulse-eight.vercel.app.
      #
      # always(), because a failing run is the data point that matters most -
      # skipping ingest on red would mean the flake history only ever sees green.
      #
      # Not on pull requests: branches that may never merge would pollute the
      # history, and the flake numbers would end up describing code nobody runs.
      - name: Record the run in TestPulse
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: Mohanad49/testpulse@main
        with:
          # The JSON report, not the JUnit one. Playwright JSON is the only
          # format of the four that reports retries, and retries are what the
          # same-commit flake strategy reads.
          path: playwright-report.json
          format: playwright
          suite: orangehrm-e2e
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          dashboard-url: https://testpulse-eight.vercel.app
          comment: "false"

  # Builds the Allure report from the test job's results and publishes it to
  # gh-pages.
  #
  # This used to be the last four steps of `test`, using
  # simple-elf/allure-report-action. That is a Docker action, and GitHub builds a
  # Docker action's image while setting up the job, before the first step runs.
  # The image starts from public.ecr.aws, which rate-limits anonymous pulls, and
  # on 9 of the 20 nights up to 2026-10-30 the pull got a 429. The job died in
  # setup: no checkout, no install, no tests, nothing for TestPulse. Then the
  # deploy step, which ran on always(), published the empty folder over the
  # live report.
  #
  # Now the report cannot stop the tests. It has its own job, the Allure CLI
  # runs straight on the runner so there is no image to pull, it only deploys a
  # report it actually generated, and continue-on-error stops a publishing
  # problem from showing up as a failed test run.
  report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # The same steps the action ran, with the same Allure release, so gh-pages
      # keeps its layout: a folder per run, the newest 20 kept, last-history
      # feeding the trend charts, and an index.html that redirects to the latest
      # run. Java 17 ships with the runner image.
      - name: Generate Allure report
        env:
          ALLURE_VERSION: "2.44.0"
          ALLURE_SHA256: "7021a90828c00cd6ec992027cce48e8a94bd87fad43d0c2dcac4795cadc178d7"
          KEEP_REPORTS: "20"
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/allure.tgz" \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/$ALLURE_VERSION/allure-commandline-$ALLURE_VERSION.tgz"
          echo "$ALLURE_SHA256  $RUNNER_TEMP/allure.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"
          allure="$RUNNER_TEMP/allure-$ALLURE_VERSION/bin/allure"

          pages_url="https://$GITHUB_REPOSITORY_OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          run="$GITHUB_RUN_NUMBER"

          mkdir -p gh-pages allure-history
          cp -r gh-pages/. allure-history
          rm -rf allure-history/.git allure-history/last-history

          # Make room for this run by keeping only the newest KEEP_REPORTS - 1.
          for dir in allure-history/*/; do
            name="$(basename "$dir")"
            if [[ "$name" =~ ^[0-9]+$ ]]; then echo "$name"; fi
          done | sort -rn | tail -n +"$KEEP_REPORTS" | while read -r old; do
            rm -rf "allure-history/$old"
          done

          if [ -d gh-pages/last-history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/last-history/. allure-results/history
          fi

          cat > allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github", "reportName": "Allure Report with history",
           "url": "$pages_url", "reportUrl": "$pages_url/$run",
           "buildUrl": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
           "buildName": "GitHub Actions Run #$GITHUB_RUN_ID", "buildOrder": "$run"}
          EOF

          "$allure" generate --clean allure-results -o allure-report

          cp -r allure-report/. "allure-history/$run"
          cp -r allure-report/history allure-history/last-history
          printf '%s\n' \
            '<!DOCTYPE html><meta charset="utf-8">' \
            "<meta http-equiv=\"refresh\" content=\"0; URL=$pages_url/$run/index.html\">" \
            '<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">' \
            > allure-history/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

  # Repeat runs of one unchanged commit, on a schedule only.
  #
  # This is the input the "same-commit disagreement" flake strategy needs: if the
  # code did not change and the outcome did, that is close to proof rather than
  # inference. Three runs of the same SHA give it something to compare.
  #
  # Deliberately a separate job from `test` rather than a matrix on it. The
  # Allure report on gh-pages is built from `test`'s results, and three copies
  # of that job would mean three reports racing to push to the same branch.
  repeat:
    name: Repeat run ${{ matrix.attempt }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Bring up a containerised OrangeHRM and test against that, not against
      # the public demo.
      #
      # The demo was the reason this suite was red. It accepted writes with
      # HTTP 200 and silently discarded them, its employee autocomplete returned
      # unrendered "${firstName} ${lastName}" template strings, and one of its
      # endpoints took 10.9 seconds to answer. None of that is fixable from a
      # test, and all of it looked like a bug in this repository.
      #
      # A container also makes the run deterministic and roughly eight times
      # faster: the full suite is about a minute here against eight against the
      # demo, because it is not queueing behind everyone else on the internet.
      - name: Start and provision OrangeHRM
        run: ./docker/up.sh http://localhost:8090

      # continue-on-error because a failing run is data, not a broken pipeline.
      # The whole point is to record what happened, and a red X on a scheduled
      # job trains people to ignore scheduled jobs.
      - name: Run tests
        continue-on-error: true
        run: npx playwright test
        env:
          ORANGEHRM_BASE_URL: http://localhost:8090
          # Not a secret: this instance is created empty and destroyed with the
          # runner. It is a strong password only because OrangeHRM 5.9 rejects
          # weak ones and redirects to a password-change screen instead of the
          # dashboard, which looks exactly like a failed login.
          ORANGEHRM_PASSWORD: Ohrm@1423
          # The only employee a fresh install has is the admin.
          ORANGEHRM_HIRING_MANAGER: OrangeHRM

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-attempt-${{ matrix.attempt }}
          path: |
            playwright-report.json
            junit-results.xml
            allure-results/
          retention-days: 30

      # Each attempt is stored as its own run. TestPulse's natural key includes
      # the start time, so three runs of one unchanged commit do not collapse
      # into one - which is the entire reason this job exists.
      - name: Record the run in TestPulse
        if: always()
        continue-on-error: true
        uses: Mohanad49/testpulse@main
        with:
          path: playwright-report.json
          format: playwright
          suite: orangehrm-e2e
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          dashboard-url: https://testpulse-eight.vercel.app
          comment: "false"
